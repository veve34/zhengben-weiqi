<script src="js/common.js"></script>
<script>
  function loadArticles(){
    var grid = document.getElementById('knowledgeGrid');
    apiRequest('/api/articles').then(function(data){
      if (!data.articles || !data.articles.length){
        grid.innerHTML = '<div class="empty-hint">暂无内容</div>';
        return;
      }
      grid.innerHTML = data.articles.map(function(a){
        return '<div class="card"><div class="thumb">' + a.title.charAt(0) + '</div><div class="body">' +
          '<span class="tag">' + a.tag + '</span><h4>' + a.title + '</h4><p>' + a.summary + '</p></div></div>';
      }).join('');
    }).catch(function(){
      grid.innerHTML = '<div class="empty-hint">内容载入失败，请稍后重试</div>';
    });
  }
  loadArticles();
</script>
