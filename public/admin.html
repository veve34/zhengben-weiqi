<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正本围棋 - 内容管理后台</title>
<style>
  :root{ --pine-800:#123b30; --pine-700:#1a4d3e; --pine-600:#22604c; --pine-50:#f4f9f7; --text-light:#5c6f68; }
  *{ box-sizing:border-box; }
  body{ font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; background:var(--pine-50); margin:0; padding:30px; color:#1c2b26; }
  h1{ color:var(--pine-800); font-size:20px; margin-bottom:20px; }
  .panel{ max-width:900px; margin:0 auto; }
  .card{ background:#fff; border:1px solid #dbe9e2; border-radius:8px; padding:24px; margin-bottom:20px; }
  input, textarea{ width:100%; padding:8px 10px; border:1px solid #c9dbd2; border-radius:4px; font-size:14px; margin-bottom:10px; font-family:inherit; }
  textarea{ min-height:70px; }
  button{ padding:8px 18px; background:var(--pine-700); color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px; }
  button:hover{ background:var(--pine-800); }
  button.danger{ background:#a94442; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ text-align:left; padding:8px; border-bottom:1px solid #e1ece7; }
  #loginPanel{ max-width:360px; margin:80px auto; }
  .row-actions{ display:flex; gap:8px; }
  .hidden{ display:none; }
  select{ padding:8px 10px; border:1px solid #c9dbd2; border-radius:4px; font-size:13px; margin-bottom:14px; }
  .status-tag{ font-size:12px; padding:2px 8px; border-radius:10px; }
  .status-pending{ background:#fbf3e3; color:#7a5a12; }
  .status-approved{ background:#e5f3ec; color:#123b30; }
  .status-rejected{ background:#fbeaea; color:#9c3a3a; }
  .status-active{ background:#e5f3ec; color:#123b30; }
  .status-removed{ background:#fbeaea; color:#9c3a3a; }
  button.approve{ background:var(--pine-600); }
  .idcard-link{ display:inline-block; padding:4px 10px; background:var(--pine-50); border:1px solid #c9dbd2; border-radius:4px; font-size:12px; color:var(--pine-700); text-decoration:none; }
  .idcard-link:hover{ background:var(--pine-600); color:#fff; border-color:var(--pine-600); }
</style>
</head>
<body>

  <div id="loginPanel" class="card">
    <h1>管理员登录</h1>
    <input type="password" id="adminPassword" placeholder="请输入管理员密码">
    <button id="adminLoginBtn">登录</button>
    <p id="loginError" style="color:#a94442;font-size:12px;"></p>
  </div>

  <div id="panel" class="panel hidden">
    <h1>正本围棋 · 会员审核</h1>

    <div class="card">
      <h3 style="margin-top:0;">会员审核</h3>
      <select id="memberStatusFilter">
        <option value="pending">待审核</option>
        <option value="approved">已通过</option>
        <option value="rejected">已驳回</option>
        <option value="all">全部</option>
      </select>
      <table>
        <thead><tr><th>用户名</th><th>邮箱</th><th>棋力</th><th>身份证照片</th><th>申请时间</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="memberList"></tbody>
      </table>
    </div>

    <h1>正本围棋 · 二手棋具信息审核</h1>

    <div class="card">
      <h3 style="margin-top:0;">二手棋具信息</h3>
      <select id="listingStatusFilter">
        <option value="pending">待审核</option>
        <option value="active">已通过（已发布）</option>
        <option value="rejected">未通过</option>
        <option value="removed">已下架</option>
        <option value="all">全部</option>
      </select>
      <table>
        <thead><tr><th>照片</th><th>标题 / 说明</th><th>发布人</th><th>联系方式</th><th>发布时间</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="listingList"></tbody>
      </table>
    </div>

    <h1>正本围棋 · 围棋知识内容管理</h1>

    <div class="card">
      <h3 style="margin-top:0;">新增文章</h3>
      <input type="text" id="newTag" placeholder="分类（例如：基础入门）">
      <input type="text" id="newTitle" placeholder="标题">
      <textarea id="newSummary" placeholder="摘要（列在标题下方的一句话）"></textarea>
      <textarea id="newContent" placeholder="正文内容。段落之间空一行分隔；要插入棋盘示意图，在单独一行写 {{diagram:名称}}，可用名称：board19、liberties、capture、forbidden、ko、handicap、territory" style="min-height:160px;"></textarea>
      <input type="number" id="newSort" placeholder="排序（数字越小越前面）" value="0">
      <button id="addBtn">新增</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">现有文章</h3>
      <table>
        <thead><tr><th>分类</th><th>标题</th><th>摘要</th><th>正文</th><th>排序</th><th>操作</th></tr></thead>
        <tbody id="articleList"></tbody>
      </table>
    </div>
  </div>

<script>
  function apiRequest(url, options){
    options = options || {};
    options.headers = Object.assign({'Content-Type':'application/json'}, options.headers || {});
    options.credentials = 'same-origin';
    return fetch(url, options).then(function(res){
      return res.json().then(function(data){
        if (!res.ok) throw new Error(data.error || '请求失败');
        return data;
      });
    });
  }

  document.getElementById('adminLoginBtn').addEventListener('click', function(){
    var password = document.getElementById('adminPassword').value;
    apiRequest('/api/admin/login', { method:'POST', body: JSON.stringify({ password: password }) })
      .then(function(){
        document.getElementById('loginPanel').classList.add('hidden');
        document.getElementById('panel').classList.remove('hidden');
        loadArticles();
        loadMembers();
        loadListings();
      })
      .catch(function(err){
        document.getElementById('loginError').textContent = err.message;
      });
  });

  var STATUS_LABEL = { pending: '待审核', approved: '已通过', rejected: '已驳回' };

  // 身份证照片存放在 public/ 之外，只能透过管理员端点取得，这里用新分页开启
  function idCardLinks(m){
    var parts = [];
    if (m.has_id_card_front) parts.push('<a class="idcard-link" href="/api/admin/members/' + m.id + '/id-card/front" target="_blank" rel="noopener">正面</a>');
    if (m.has_id_card_back) parts.push('<a class="idcard-link" href="/api/admin/members/' + m.id + '/id-card/back" target="_blank" rel="noopener">背面</a>');
    return parts.length ? parts.join(' ') : '<span style="color:#a94442;font-size:12px;">未上传</span>';
  }

  function loadMembers(){
    var status = document.getElementById('memberStatusFilter').value;
    apiRequest('/api/admin/members?status=' + status).then(function(data){
      var tbody = document.getElementById('memberList');
      if (!data.members.length){
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#5c6f68;">没有符合条件的会员</td></tr>';
        return;
      }
      tbody.innerHTML = data.members.map(function(m){
        var actions = m.status === 'pending'
          ? '<button class="approve" data-id="' + m.id + '" data-action="approve">通过</button> <button class="danger" data-id="' + m.id + '" data-action="reject">驳回</button>'
          : '<button data-id="' + m.id + '" data-action="' + (m.status === 'approved' ? 'reject' : 'approve') + '">' + (m.status === 'approved' ? '改为驳回' : '改为通过') + '</button>';
        return '<tr>' +
          '<td>' + escapeHtml(m.username) + '</td>' +
          '<td style="font-size:12px;">' + escapeHtml(m.email) + '</td>' +
          '<td style="font-size:12px;">' + escapeHtml(m.level || '—') + '</td>' +
          '<td class="row-actions">' + idCardLinks(m) + '</td>' +
          '<td>' + m.created_at + '</td>' +
          '<td><span class="status-tag status-' + m.status + '">' + STATUS_LABEL[m.status] + '</span></td>' +
          '<td class="row-actions">' + actions + '</td>' +
          '</tr>';
      }).join('');

      tbody.querySelectorAll('button[data-action]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-id');
          var action = btn.getAttribute('data-action');
          apiRequest('/api/admin/members/' + id + '/' + action, { method:'POST' })
            .then(function(){ loadMembers(); })
            .catch(function(err){ alert(err.message); });
        });
      });
    });
  }

  document.getElementById('memberStatusFilter').addEventListener('change', loadMembers);

  var LISTING_STATUS_LABEL = {
    pending: '待审核', active: '已发布', rejected: '未通过', removed: '已删除'
  };
  var LISTING_ACTION_CONFIRM = {
    approve: null,
    reject: '确定要驳回这条信息吗？驳回后不会对外公开。',
    remove: '确定要下架这条信息吗？'
  };

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function loadListings(){
    var status = document.getElementById('listingStatusFilter').value;
    apiRequest('/api/admin/listings?status=' + status).then(function(data){
      var tbody = document.getElementById('listingList');
      if (!data.listings.length){
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#5c6f68;">没有符合条件的信息</td></tr>';
        return;
      }
      tbody.innerHTML = data.listings.map(function(l){
        var actions = [];
        if (l.status === 'pending' || l.status === 'rejected'){
          actions.push('<button class="approve" data-id="' + l.id + '" data-action="approve">通过</button>');
        }
        if (l.status === 'pending' || l.status === 'active'){
          actions.push('<button class="danger" data-id="' + l.id + '" data-action="reject">驳回</button>');
        }
        if (l.status !== 'removed'){
          actions.push('<button class="danger" data-id="' + l.id + '" data-action="remove">下架</button>');
        }
        var thumb = l.images.length
          ? '<img src="' + l.images[0] + '" style="width:76px;height:57px;object-fit:cover;border-radius:4px;" alt="">' +
            (l.images.length > 1 ? '<div style="font-size:11px;color:#5c6f68;">共' + l.images.length + '张</div>' : '')
          : '<span style="color:#5c6f68;font-size:12px;">无图</span>';
        return '<tr>' +
          '<td>' + thumb + '</td>' +
          '<td style="max-width:280px;"><div style="font-weight:600;">' + escapeHtml(l.title) + '</div>' +
          '<div style="font-size:12px;color:#5c6f68;margin-top:4px;">' + escapeHtml(l.category) + '｜' +
          escapeHtml(l.description).slice(0, 80) + '…</div></td>' +
          '<td>' + escapeHtml(l.seller_name) + '</td>' +
          '<td style="font-size:12px;">' + escapeHtml(l.contact_info) + '<div style="color:#5c6f68;">注册号 ' + l.seller_phone + '</div></td>' +
          '<td style="font-size:12px;">' + l.created_at + '</td>' +
          '<td><span class="status-tag status-' + l.status + '">' + LISTING_STATUS_LABEL[l.status] + '</span></td>' +
          '<td class="row-actions">' + actions.join(' ') + '</td>' +
          '</tr>';
      }).join('');

      tbody.querySelectorAll('button[data-action]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var action = btn.getAttribute('data-action');
          var confirmMsg = LISTING_ACTION_CONFIRM[action];
          if (confirmMsg && !confirm(confirmMsg)) return;
          apiRequest('/api/admin/listings/' + btn.getAttribute('data-id') + '/' + action, { method:'POST' })
            .then(function(){ loadListings(); })
            .catch(function(err){ alert(err.message); });
        });
      });
    });
  }

  document.getElementById('listingStatusFilter').addEventListener('change', loadListings);

  function loadArticles(){
    apiRequest('/api/articles').then(function(data){
      var tbody = document.getElementById('articleList');
      tbody.innerHTML = data.articles.map(function(a){
        return '<tr data-id="' + a.id + '">' +
          '<td><input value="' + escapeHtml(a.tag) + '" data-field="tag"></td>' +
          '<td><input value="' + escapeHtml(a.title) + '" data-field="title"></td>' +
          '<td><textarea data-field="summary">' + escapeHtml(a.summary) + '</textarea></td>' +
          '<td><textarea data-field="content" style="min-width:260px;min-height:150px;">' + escapeHtml(a.content || '') + '</textarea></td>' +
          '<td><input type="number" value="' + a.sort_order + '" data-field="sortOrder" style="width:70px;"></td>' +
          '<td class="row-actions"><button class="saveBtn">保存</button><button class="danger delBtn">删除</button></td>' +
          '</tr>';
      }).join('');

      tbody.querySelectorAll('.saveBtn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var tr = btn.closest('tr');
          var id = tr.getAttribute('data-id');
          var payload = {
            tag: tr.querySelector('[data-field="tag"]').value,
            title: tr.querySelector('[data-field="title"]').value,
            summary: tr.querySelector('[data-field="summary"]').value,
            content: tr.querySelector('[data-field="content"]').value,
            sortOrder: tr.querySelector('[data-field="sortOrder"]').value
          };
          apiRequest('/api/articles/' + id, { method:'PUT', body: JSON.stringify(payload) })
            .then(function(){ alert('已保存'); })
            .catch(function(err){ alert(err.message); });
        });
      });
      tbody.querySelectorAll('.delBtn').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (!confirm('确定删除这篇文章？')) return;
          var id = btn.closest('tr').getAttribute('data-id');
          apiRequest('/api/articles/' + id, { method:'DELETE' })
            .then(function(){ loadArticles(); })
            .catch(function(err){ alert(err.message); });
        });
      });
    });
  }

  document.getElementById('addBtn').addEventListener('click', function(){
    var payload = {
      tag: document.getElementById('newTag').value,
      title: document.getElementById('newTitle').value,
      summary: document.getElementById('newSummary').value,
      content: document.getElementById('newContent').value,
      sortOrder: document.getElementById('newSort').value
    };
    apiRequest('/api/articles', { method:'POST', body: JSON.stringify(payload) })
      .then(function(){
        document.getElementById('newTag').value = '';
        document.getElementById('newTitle').value = '';
        document.getElementById('newSummary').value = '';
        document.getElementById('newContent').value = '';
        document.getElementById('newSort').value = '0';
        loadArticles();
      })
      .catch(function(err){ alert(err.message); });
  });
</script>
</body>
</html>
