<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会员登录 - 正本围棋</title>
<meta name="description" content="登录正本围棋会员帐号。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="mark"></div>
        <div class="text">
          <h1>正本围棋</h1>
          <span>ZHENGBEN WEIQI · 围棋文化推广平台</span>
        </div>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">首页</a></li>
          <li><a href="knowledge.html">围棋知识</a></li>
          <li><a href="marketplace.html">二手交易</a></li>
          <li><a href="membership.html">会员方案</a></li>
          <li><a href="register.html" data-guest-only>会员注册</a></li>
          <li><a href="member-center.html" data-member-only style="display:none">会员中心</a></li>
          <li><a href="contact.html">关于我们</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 登录 -->
  <section id="login" class="register-section">
    <div class="section-inner">
      <div class="section-title">
        <div class="en">Member Login</div>
        <h3>会员登录</h3>
        <div class="bar"></div>
      </div>
      <div class="register-wrap">
        <form id="loginForm">
          <div class="form-group full" style="margin-bottom:18px;">
            <label>手机号码 <span class="req">*</span></label>
            <input type="tel" name="phone" placeholder="请输入注册时的手机号" maxlength="11" required>
          </div>
          <div class="form-group full" style="margin-bottom:18px;">
            <label>登录密码 <span class="req">*</span></label>
            <input type="password" name="password" placeholder="请输入密码" required>
          </div>
          <button type="submit" class="submit-btn">登录</button>
          <div class="form-msg ok" id="loginMsg"></div>
        </form>
        <div class="switch-link">还没有帐号？<a href="register.html">立即注册</a></div>
      </div>
    </div>
  </section>

  <footer>
    <p>网站名称：正本围棋 &nbsp;|&nbsp; 网站域名：jingjianyinghe.com</p>
    <p>主办者名称：杭州精尖硬核棋道信息科技有限公司</p>
    <p>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">浙ICP备2026043380号</a>
      &nbsp;|&nbsp; 网站备案号：浙ICP备2026043380号-1
    </p>
    <p>© 2026 正本围棋 版权所有</p>
  </footer>

<script src="js/common.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var form = e.target;
    var msg = document.getElementById('loginMsg');
    apiRequest('/api/auth/login', {
      method:'POST',
      body: JSON.stringify({ phone: form.phone.value.trim(), password: form.password.value })
    }).then(function(){
      msg.textContent = '登录成功！';
      msg.className = 'form-msg ok';
      msg.style.display = 'block';
      setTimeout(function(){ window.location.href = 'member-center.html'; }, 500);
    }).catch(function(err){
      msg.textContent = err.message;
      msg.className = 'form-msg err';
      msg.style.display = 'block';
    });
  });
</script>
</body>
</html>
